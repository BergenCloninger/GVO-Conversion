# config.ini

# ---- Communication ----
com_port=1
oms_dll=68SERMC.DLL

# ---- Paths ----
teleapi_dll=teleapi.dll

# ---- Tracking / motion ----
TrkRate=500.6
RAFact=120000

# ---- Location ----
C_Lat=38.5086
C_Long=-106.9386

# ---- Normal hand paddle speeds ----
# Used when Manual/Fast button is NOT held
handpad_ra_east_rate=3000
handpad_ra_west_rate=3000
handpad_dec_rate=1000

# ---- Fast paddle ONLY ----
fastpad_x_fine=12000
fastpad_y_fine=8000

# ---- DEC bump behavior ----
dec_bump_rate=75
dec_bump_ms=100

# ---- Optional axis defaults ----
xvl=10000
xac=35000
yvl=5000
yac=25000
xacmax=35000
xvlmax=75000
yacmax=25000
yvlmax=100000

# ---- Debug ----
verbose=1